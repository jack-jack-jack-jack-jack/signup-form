<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="left">
        <div class="hero">
            <img src="./imgs/odin.png.png" alt="odin">
            <h2>ODIN</h2>
        </div>
        <div class="credit">
            <p>Photo by <a href="#">Hailie West</a> on <a href="#">Unsplash</a></p>
        </div>
    </div>
    <div class="right">
        <div class="top">
            <p>This is not a real online sevice! You know you need
                something like this in your life to help you realize 
                your deepest dreams.
            </p>
            <p>Sign up <i>now</i> to get started</p>
            <p>You <i>know</i> you want to.</p>
        </div>
        <div class="mid">
            <h3>Let's do this!</h3>
            <form action="#" method="post">
                <div class="form-left">
                    <div class="form-group">
                        <label for="first-name">First name</label>
                        <input
                            type="text"
                            id="first-name"
                            name="first-name"
                            required
                            minlength="2"
                            autocomplete="given-name"
                        >
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            autocomplete="email"
                        >
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            minlength="8"
                            pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}"
                            title="At least 8 characters, including uppercase, lowercase and a number"
                            autocomplete="new-password"
                        >
                    </div>
                </div>
                <div class="form-right">
                    <div class="form-group">
                        <label for="last-name">Last name</label>
                        <input
                            type="text"
                            id="last-name"
                            name="last-name"
                            required
                            minlength="2"
                            autocomplete="family-name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone number</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            required
                            pattern="[0-9 ]{10,15}"
                            title="Enter 10–15 digits or spaces"
                            autocomplete="tel"
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm password</label>
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            required
                            minlength="8"
                        >
                    </div>
                </div>
            </form>
        </div>
        <div class="btm">
            <button type="submit">Create account</button>
            <p>Already have an account? <a href="#">Log in</a></p>
        </div>
    </div>
    
</body>
</html>
